[project]
name = "enterprise-ai-agents-backend"
version = "1.0.0"
description = "Backend service for Enterprise AI Agents Integration"
authors = [{ name = "Herman Swanepoel" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.104.1",
  "uvicorn[standard]>=0.24.0",
  "websockets>=12.0",
  "pydantic>=2.5.0",
  "prometheus-client>=0.20.0",
  "celery>=5.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.3",
  "pytest-asyncio>=0.21.1",
  "pytest-cov>=4.1.0",
  "black>=23.12.0",
  "flake8>=6.1.0",
  "mypy>=1.7.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
