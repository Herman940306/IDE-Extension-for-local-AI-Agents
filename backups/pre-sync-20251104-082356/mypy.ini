[mypy]
python_version = 3.10
warn_unused_configs = True
show_error_codes = True
# Be practical: skip third-party packages without typing
ignore_missing_imports = True
follow_imports = silent
sqlite_cache = True
incremental = False

# Limit analysis to a small, fully-typed set for now (pre-commit relies on this)
# TODO: expand incrementally as modules are typed
files = backend/src/services/context_manager.py, backend/src/services/metrics_service.py

# Temporarily exclude noisy modules from strict checking to unblock CI.
# We will incrementally re-enable these as they are typed.
exclude = (?x)(
    ^backend/src/services/memory_service\.py$
  | ^backend/src/memory/episodic_cache\.py$
  | ^backend/src/core/connection_pool\.py$
  | ^backend/src/services/llm_manager\.py$
  | ^backend/src/services/task_orchestrator\.py$
  | ^backend/src/services/telemetry_service\.py$
  | ^backend/src/services/self_healing_manager\.py$
  | ^backend/src/services/predictive_cache_manager\.py$
  | ^backend/src/services/context_manager\.py$
  | ^backend/src/orchestrator/meta_controller\.py$
  | ^backend/src/orchestrator/meta_orchestrator\.py$
  | ^backend/src/orchestrator/reasoning_coordinator\.py$
  | ^backend/src/models/reasoner\.py$
  | ^backend/src/models/verifier\.py$
  | ^backend/src/memory/semantic_store\.py$
  | ^backend/src/agents/refactor_agent\.py$
  | ^backend/src/agents/bug_agent\.py$
  | ^backend/src/services/retrieval/helpers\.py$
  | ^backend/src/services/retrieval/langchain_retrievers\.py$
  )

# You can tighten these over time
# Enable checking bodies of untyped functions for stricter analysis
check_untyped_defs = True
no_implicit_optional = False

# Per-module overrides for chatty libs (kept for clarity even with global ignore)
[mypy-networkx.*]
ignore_missing_imports = True

[mypy-crewai.*]
ignore_missing_imports = True

[mypy-faiss]
ignore_missing_imports = True

[mypy-faiss.*]
ignore_missing_imports = True

[mypy-catboost.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True
