name: Confidentiality Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect confidential path changes
        run: |
          echo "Checking for changes under 'AuraIA IDE Vision and Roadmap/'..."
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed_files.txt
          if grep -E "^AuraIA IDE Vision and Roadmap/" changed_files.txt; then
            echo "Confidential files detected in PR changes. Failing the job." >&2
            exit 1
          else
            echo "No confidential changes detected."
          fi
