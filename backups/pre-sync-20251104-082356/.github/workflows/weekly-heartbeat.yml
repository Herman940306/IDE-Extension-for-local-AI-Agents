name: Weekly Heartbeat

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run heartbeat check
        id: heartbeat
        env:
          HEARTBEAT_BASE_URL: ${{ vars.HEARTBEAT_BASE_URL }}
          HEARTBEAT_INSECURE: ${{ vars.HEARTBEAT_INSECURE }}
        run: |
          python scripts/heartbeat_check.py | tee heartbeat_output.txt

      - name: Upload heartbeat output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-output
          path: heartbeat_output.txt

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('heartbeat_output.txt', 'utf8');
            const now = new Date().toISOString();
            const title = `Heartbeat failed: ${now}`;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Heartbeat checks failed.\n\nRun: ${runUrl}\n\nOutput:\n\n\n\n${body}`,
            });
            core.info(`Opened issue #${issue.data.number}`);
