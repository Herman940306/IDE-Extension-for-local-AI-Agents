apiVersion: 1

groups:
  - orgId: 1
    name: smoke
    folder: Operations
    interval: 1m
    rules:
      - uid: smoke_test_email
        title: Smoke Test Email (One-click)
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum(up) == 0
              instant: false
              interval: ""
              intervalFactor: 1
              legendFormat: ""
              refId: A
            relativeTimeRange:
              from: 600
              to: 0
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Smoke test email alert"
          description: "Synthetic alert to verify email contact point. Disable after verification."
        labels:
          severity: info
        isPaused: false
