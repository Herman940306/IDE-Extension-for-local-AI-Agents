version: "3.9"

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1000 --loglevel warning
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auraia

  ollama:
    image: ollama/ollama:0.3.12
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEPALIVE=1h
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - auraia

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env.production
    environment:
      - DB_REDIS_URL=${DB_REDIS_URL:-redis://redis:6379/0}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/var/lib/auraia/chroma}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - backend_state:/var/lib/auraia
      - backend_logs:/var/log/auraia
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8001/health'', timeout=5)"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - auraia

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - AURAIA_USE_CELERY=true
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    command: celery -A src.worker.celery_app:app worker --loglevel=info --concurrency=2
    ports:
      - "9100:9100"  # Prometheus metrics for worker
    networks:
      - auraia

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.route-prefix=/prometheus"
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started
    networks:
      - auraia

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change_me}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - auraia

  caddy:
    build:
      context: ./monitoring/caddy
      dockerfile: Dockerfile
    container_name: auraia_caddy
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
      - SERVER_DOMAIN=${SERVER_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "9180:9180" # Caddy Prometheus metrics (internal preferred)
    volumes:
      - ./monitoring/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - grafana
      - prometheus
    restart: unless-stopped
    networks:
      - auraia

volumes:
  redis_data:
  ollama_models:
  backend_state:
  backend_logs:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  auraia:
    driver: bridge
