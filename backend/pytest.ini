[pytest]
# Pytest configuration for AuraIA v2.0
# Project Creator: Herman Swanepoel

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests (require Ollama)
    slow: Slow tests

# Asyncio mode
asyncio_mode = auto

# Coverage
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Logging
log_cli = false
log_cli_level = INFO
