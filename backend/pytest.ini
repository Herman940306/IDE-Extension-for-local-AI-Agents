[pytest]
# Pytest configuration for AuraIA v2.0 - System Refactoring v1
# Project Creator: Herman Swanepoel
# Updated: 2025-10-13

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests (require Ollama)
    slow: Slow tests
    performance: Performance benchmark tests

# Asyncio mode
asyncio_mode = auto

# Coverage Configuration
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85

# Logging
log_cli = false
log_cli_level = INFO

[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
