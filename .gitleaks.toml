title = "AuraIA Gitleaks Configuration"

[extend]
  paths = []

[allowlist]
  description = "Allow common non-secret patterns"
  paths = [
    "docs/",
    "logs/",
    ".gitignore"
  ]
  regexes = [
    "(?i)example(_|-)?(key|token|secret)",
    "(?i)changeme",
    "(?i)<placeholder>",
    "(?i)dummy"
  ]
