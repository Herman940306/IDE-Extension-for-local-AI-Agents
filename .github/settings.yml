# Repository settings for IDE-Extension-for-local-AI-Agents
# This file defines branch protection rules and other repository settings
# Compatible with Probot Settings app or can be applied manually via GitHub UI

repository:
  # Repository description
  description: "AuraIA: A Next-Generation Cognitive AI Partner for VS Code"

  # Repository homepage
  homepage: https://github.com/Herman940306/IDE-Extension-for-local-AI-Agents

  # Repository topics/tags
  topics: ai, vscode-extension, llm, local-ai, privacy-first, cognitive-architecture

  # Enable features
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true

  # Allow squash merging
  allow_squash_merge: true

  # Allow merge commits
  allow_merge_commit: true

  # Allow rebase merging
  allow_rebase_merge: true

  # Automatically delete head branches after merge
  delete_branch_on_merge: true

# Branch protection rules
branches:
  - name: main
    # Require pull request reviews before merging
    protection:
      # Require at least one approval before merging
      required_pull_request_reviews:
        # Dismiss stale pull request approvals when new commits are pushed
        dismiss_stale_reviews: true
        # Require review from code owners
        require_code_owner_reviews: false
        # Number of required approving reviews
        required_approving_review_count: 1
        # Require approval from someone other than the last pusher
        require_last_push_approval: false

      # Require status checks to pass before merging
      required_status_checks:
        # Require branches to be up to date before merging
        strict: true
        # List of required status checks (job names from workflows)
        checks:
          - context: "Backend Lint & Config Checks"
            app_id: -1  # GitHub Actions
          - context: "Backend Tests (with coverage gate)"
            app_id: -1  # GitHub Actions
          - context: "Extension Build & Package"
            app_id: -1  # GitHub Actions
          - context: "Backend Docker Build"
            app_id: -1  # GitHub Actions
          - context: "mypy (backend)"
            app_id: -1  # GitHub Actions
          - context: "Gitleaks Secret Scan"
            app_id: -1  # GitHub Actions

      # Enforce all configured restrictions for administrators
      enforce_admins: false

      # Prevent force pushes
      allow_force_pushes: false

      # Prevent deletion of the branch
      allow_deletions: false

      # Require linear history (no merge commits)
      required_linear_history: false

      # Require conversation resolution before merging
      required_conversation_resolution: true

      # Lock branch (prevent all pushes, even from admins)
      lock_branch: false

      # Allow fork syncing
      allow_fork_syncing: true

      # Require signed commits
      required_signatures: false

  # Optional: Add protection for feature branches if needed
  # - name: feat/*
  #   protection:
  #     required_pull_request_reviews: null
  #     required_status_checks: null
  #     enforce_admins: false
  #     allow_force_pushes: true
  #     allow_deletions: true
