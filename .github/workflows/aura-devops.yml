name: AURADEVOPS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          python -m flake8 src

      - name: Type check (mypy)
        run: |
          python -m mypy src

      - name: Run unit tests with full coverage report (no gate)
        run: |
          python -m pytest -v --maxfail=1 --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Core modules coverage gate (>= 80%)
        run: |
          python -m pytest -v --maxfail=1 -m "not integration" -k "not test_very_short_timeout" \
            --cov=src/models/response.py \
            --cov=src/models/task.py \
            --cov=src/models/session.py \
            --cov=src/core/container.py \
            --cov=src/config/settings.py \
            --cov=src/orchestrator/task_router.py \
            --cov-report=term \
            --cov-fail-under=80

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/htmlcov
