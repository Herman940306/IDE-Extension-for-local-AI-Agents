name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Quality Gates
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt black flake8 pytest

      - name: Black formatting check
        run: black backend --line-length=100 --check

      - name: Flake8 lint
        run: flake8 backend

      - name: Pytest suite
        run: pytest backend/tests -v
