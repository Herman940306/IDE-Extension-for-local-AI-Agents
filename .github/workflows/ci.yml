name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install provisioning linters
        run: |
          python -m pip install yamllint

      - name: Black formatting check
        run: black backend --check --line-length=100

      - name: Flake8 lint
        run: flake8 backend

      - name: Run pytest (unit-only)
        working-directory: backend
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -v -m "not integration and not slow and not performance"

      - name: YAML lint (monitoring)
        run: |
          yamllint -s monitoring

      - name: Validate Prometheus config with promtool
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/monitoring:/etc/prometheus:ro" prom/prometheus:v2.53.0 \
            promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$GITHUB_WORKSPACE/monitoring:/etc/prometheus:ro" prom/prometheus:v2.53.0 \
            promtool check rules /etc/prometheus/alerts.yml /etc/prometheus/recording-rules.yml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov

  extension-build:
    name: Extension Build & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (with cache if lockfile exists)
        if: ${{ hashFiles('extension/package-lock.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Set up Node.js (no cache, no lockfile)
        if: ${{ hashFiles('extension/package-lock.json') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (npm ci)
        if: ${{ hashFiles('extension/package-lock.json') != '' }}
        working-directory: extension
        run: npm ci

      - name: Install dependencies (npm install)
        if: ${{ hashFiles('extension/package-lock.json') == '' }}
        working-directory: extension
        run: npm install

      - name: Compile TypeScript
        working-directory: extension
        run: npm run compile

      - name: Cache vsce tool and extension package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vsce
            ~/.npm/_cacache
          key: vsce-${{ runner.os }}-node-20-v1
          restore-keys: |
            vsce-${{ runner.os }}-node-20-

      - name: Package VS Code extension
        working-directory: extension
        run: npm run package

      - name: Upload VSIX artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-assistant-vsix
          path: extension/*.vsix
          if-no-files-found: error

  docker-build:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-quality
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize owner to lowercase (for GHCR)
        id: owner_lc
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (non-PR events)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          # Push only on non-PR events; otherwise just validate the build
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.owner_lc.outputs.owner_lc }}/aura-backend:ci
            ghcr.io/${{ steps.owner_lc.outputs.owner_lc }}/aura-backend:${{ github.sha }}
