name: Typecheck (mypy)

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  mypy:
    name: mypy (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run mypy
        run: |
          python -m mypy backend/src --config-file mypy.ini
