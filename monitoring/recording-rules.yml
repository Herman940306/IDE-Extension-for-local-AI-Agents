---
groups:
  - name: backend_recording
    interval: 30s
    rules:
      # Request rate (all)
      - record: http_requests:rate5m
        expr: sum(rate(http_requests_total[5m]))

      # Backend request rate alias (FastAPI middleware is exporting http_requests_total)
      - record: fastapi_requests:rate5m
        expr: sum(rate(http_requests_total[5m]))

      # Pre-aggregate histogram buckets for latency quantiles
      - record: job:http_request_duration_seconds_bucket:rate5m
        expr: sum by (le) (rate(http_request_duration_seconds_bucket[5m]))

      # P90 and P99 latency using pre-aggregated buckets
      - record: http_request_duration_seconds:p90:rate5m
        expr: histogram_quantile(0.90, job:http_request_duration_seconds_bucket:rate5m)
      - record: http_request_duration_seconds:p99:rate5m
        expr: histogram_quantile(0.99, job:http_request_duration_seconds_bucket:rate5m)

  - name: infra_recording
    interval: 30s
    rules:
      # Count of healthy scrape targets
      - record: up:targets:sum
        expr: sum(up)
