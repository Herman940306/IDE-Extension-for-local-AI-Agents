groups:
  - name: auraia-availability
    rules:
      - alert: AuraIABackendDown
        expr: up{job="auraia-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: auraia-backend
        annotations:
          summary: AuraIA backend is not responding to Prometheus scrapes
          description: |
            The auraia-backend target has returned up=0 for more than two minutes.
            Check the container logs, recent deployments, and upstream dependencies.

      - alert: AuraIARedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
          service: auraia-redis
        annotations:
          summary: Redis cache endpoint is unreachable from Prometheus
          description: |
            Prometheus cannot scrape the Redis exporter target. Validate that the Redis
            container or managed instance is online and that network policies allow access.

      - alert: AuraIAPrometheusTargetMissing
        expr: absent(up{job="auraia-backend"})
        for: 1m
        labels:
          severity: warning
          service: prometheus
        annotations:
          summary: Prometheus cannot find the auraia-backend scrape target
          description: |
            The auraia-backend job disappeared from the Prometheus target list. Check service discovery,
            container names, and networking between Prometheus and the backend service.

  - name: auraia-performance
    rules:
      - alert: AuraIABackendHighErrorRate
        expr: increase(http_requests_total{status_code=~"5.."}[5m]) / ignoring(status_code) increase(http_requests_total[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
          service: auraia-backend
        annotations:
          summary: Backend HTTP 5xx error rate exceeded 5% in the last 10 minutes
          description: |
            Investigate upstream LLM providers, Redis availability, and recent deployments. Review Grafana panels
            for latency spikes and correlate with application logs.

  - name: backend_alerts
    rules:
      - alert: High5xxErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests returned 5xx errors in the last 5m."

      - alert: HighP99Latency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p99 latency"
          description: "p99 latency > 1s over last 5m window."

      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target down"
          description: "{{ $labels.instance }} is unreachable."

      # Optional stricter thresholds for paging
      - alert: Critical5xxErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical 5xx error rate"
          description: "> 20% 5xx over 5m. Immediate attention required."

      - alert: CriticalP99Latency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical p99 latency"
          description: "p99 latency > 2s over last 5m window."

  - name: latency_p95_alerts
    rules:
      - alert: HighP95Latency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency"
          description: "p95 latency > 750ms over last 5m window."

      - alert: CriticalP95Latency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical p95 latency"
          description: "p95 latency > 1.5s over last 5m window."

  - name: caddy_alerts
    rules:
      - alert: CaddyHigh5xxRate
        expr: rate(caddy_http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Caddy 5xx error rate high"
          description: "Caddy returned >5% 5xx over last 5m. Check upstream/backends."

      - alert: CaddyCritical5xxRate
        expr: rate(caddy_http_requests_total{status=~"5.."}[5m]) > 0.2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Caddy 5xx error rate critical"
          description: ">20% 5xx via Caddy over 5m."

  - name: gpu_vram_alerts
    rules:
      # DCGM exporter: VRAM utilization per GPU > 90% (warning) and >95% (critical)
      - alert: GPUVRAMHighDCGM
        expr: (sum by (gpu, instance) (DCGM_FI_DEV_FB_USED)) / (sum by (gpu, instance) (DCGM_FI_DEV_FB_TOTAL)) > 0.9
        for: 10m
        labels:
          severity: warning
          source: dcgm
        annotations:
          summary: "GPU VRAM high (DCGM)"
          description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} VRAM > 90% for 10m (DCGM)."

      - alert: GPUVRAMCriticalDCGM
        expr: (sum by (gpu, instance) (DCGM_FI_DEV_FB_USED)) / (sum by (gpu, instance) (DCGM_FI_DEV_FB_TOTAL)) > 0.95
        for: 10m
        labels:
          severity: critical
          source: dcgm
        annotations:
          summary: "GPU VRAM critical (DCGM)"
          description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} VRAM > 95% for 10m (DCGM)."

      # nvidia-smi exporter: VRAM utilization per GPU > 90% (warning) and >95% (critical)
      - alert: GPUVRAMHighNvidiaSMI
        expr: (sum by (gpu, instance) (nvidia_gpu_memory_used_bytes)) / (sum by (gpu, instance) (nvidia_gpu_memory_total_bytes)) > 0.9
        for: 10m
        labels:
          severity: warning
          source: nvidia_smi
        annotations:
          summary: "GPU VRAM high (nvidia-smi)"
          description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} VRAM > 90% for 10m (nvidia-smi)."

      - alert: GPUVRAMCriticalNvidiaSMI
        expr: (sum by (gpu, instance) (nvidia_gpu_memory_used_bytes)) / (sum by (gpu, instance) (nvidia_gpu_memory_total_bytes)) > 0.95
        for: 10m
        labels:
          severity: critical
          source: nvidia_smi
        annotations:
          summary: "GPU VRAM critical (nvidia-smi)"
          description: "GPU {{ $labels.gpu }} on {{ $labels.instance }} VRAM > 95% for 10m (nvidia-smi)."
