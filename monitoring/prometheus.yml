global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "auraia-backend"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - backend:8001
    relabel_configs:
      - source_labels: [__address__]
        regex: "(.*)"
        replacement: "${1}"
        target_label: instance

  - job_name: "ollama"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - ollama:11434

  - job_name: "prometheus"
    static_configs:
      - targets:
          - prometheus:9090
