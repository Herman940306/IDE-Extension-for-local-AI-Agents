---
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    orgId: 1
    # Prometheus is started with --web.route-prefix=/prometheus, so include it here
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
    version: 1
    jsonData:
      timeInterval: 15s
