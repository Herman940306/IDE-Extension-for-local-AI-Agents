version: "3.9"

# Development override: expose selected service ports for local debugging
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  backend:
    ports:
      - "8001:8001"

  grafana:
    ports:
      - "3000:3000"

  prometheus:
    ports:
      - "9090:9090"

  redis:
    ports:
      - "6379:6379"

  ollama:
    ports:
      - "11434:11434"
