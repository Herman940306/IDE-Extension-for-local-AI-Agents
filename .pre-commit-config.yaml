repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length=88"]

  - repo: https://github.com/pre-commit/mirrors-pytest
    rev: v1.0.0
    hooks:
      - id: pytest
        args: ["-q", "--maxfail=1", "--disable-warnings"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["--config-file=mypy.ini"]
        additional_dependencies: []

  - repo: local
    hooks:
      - id: block-confidential-paths
        name: Block commits to confidential folder
        description: Prevent committing files under 'AuraIA IDE Vision and Roadmap/'
        language: pygrep
        entry: .
        files: ^AuraIA IDE Vision and Roadmap/
